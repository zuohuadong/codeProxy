name: Mirror panel release

# The relay downloads the panel from a GitHub *release* asset, but upstream cuts
# panel releases slowly: the newest one can predate features its `dev` branch
# already ships (the billing page, for example). This mirror builds the panel
# from upstream `dev` itself and publishes it as this repository's latest
# release, so a relay pointed at this repository always installs a panel that
# matches the backend it runs against.
#
# Each release is tagged with the upstream commit it was built from, so a given
# relay's `.panel-version` can be traced back to a source revision.

on:
  schedule:
    # Daily, off the hour to avoid GitHub's peak queue.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror-panel
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: https://github.com/kittors/codeProxy.git
  UPSTREAM_BRANCH: dev
  # Keep in sync with the upstream release workflow.
  BUN_VERSION: 1.3.11

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve the upstream revision to build
        id: upstream
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM_REPOSITORY"
          git fetch --depth 1 upstream "$UPSTREAM_BRANCH"
          sha="$(git rev-parse FETCH_HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=panel-${sha:0:12}" >> "$GITHUB_OUTPUT"

      - name: Check whether this revision is already published
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the upstream revision
        if: steps.exists.outputs.published == 'false'
        run: git checkout --force "${{ steps.upstream.outputs.sha }}"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.exists.outputs.published == 'false'
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build the panel
        if: steps.exists.outputs.published == 'false'
        env:
          VITE_APP_VERSION: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run build

      - name: Package panel-dist.zip
        if: steps.exists.outputs.published == 'false'
        run: cd dist && zip -r ../panel-dist.zip manage.html assets/

      - name: Publish the release
        if: steps.exists.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.upstream.outputs.tag }}
          SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          set -euo pipefail
          gh release create "$TAG" panel-dist.zip dist/management.html \
            --latest \
            --title "Panel $TAG" \
            --notes "Built from ${UPSTREAM_REPOSITORY%.git}@$SHA ($UPSTREAM_BRANCH)."

      - name: Report the published revision
        if: steps.exists.outputs.published == 'true'
        run: echo "${{ steps.upstream.outputs.tag }} is already released; nothing to do."